name: 앨범 사이트 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 영상 변환 도구(ffmpeg) 준비
        run: which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: 이전에 줄여 둔 영상 불러오기
        uses: actions/cache@v4
        with:
          path: .cache
          key: video-${{ github.run_id }}
          restore-keys: video-
      - run: npm install --no-audit --no-fund
      - run: node scripts/build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
